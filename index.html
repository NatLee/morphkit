<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MorphKit — Simple file converter</title>
    <meta name="description" content="A simple file converter for images, audio and video. Runs entirely in your browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1.5c8.5-.8 14.8 6 14.4 14.3C30 24.2 24.3 30.8 15.6 30.4 7.5 30 1.2 24.3 1.6 15.7 2 8 8 2.2 16 1.5z' fill='%23c2452c'/%3E%3Cpath d='M10 21V11l6 6 6-6v10' stroke='%23fcf8ec' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to avoid flash
      try {
        var t = localStorage.getItem('morphkit-theme') || 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
