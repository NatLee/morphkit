<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MorphKit — Simple file converter</title>
    <meta name="description" content="A simple file converter for images, audio and video. Runs entirely in your browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338dfff'/%3E%3Cstop offset='1' stop-color='%23ff5c8a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M6 1h20l5 5v20l-5 5H6l-5-5V6z' fill='%230a0e1c'/%3E%3Cpath d='M10 21V11l6 6 6-6v10' stroke='url(%23g)' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- PWA: installable app (manifest + icons); sw.js registered in main.tsx -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f2f5fb" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- translucent status bar overlays the page (both themes look right);
         the standalone topbar already pads past env(safe-area-inset-top) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MorphKit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the theme before first paint to avoid flash. App-like default:
      // no explicit choice stored -> follow the OS (prefers-color-scheme);
      // App.useTheme keeps this + the theme-color meta live afterwards.
      try {
        var s = localStorage.getItem('morphkit-theme');
        var t = s === 'light' || s === 'dark'
          ? s
          : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0a0e1c' : '#f2f5fb');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
